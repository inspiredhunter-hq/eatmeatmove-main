<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Eat Meat Move</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --red: #c8102e;
      --red-dark: #a80d27;
      --ink: #1f2226;
      --muted: #60646b;
      --paper: #fbfaf8;
      --line: #e7e3de;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background:
        radial-gradient(circle at 50% 16%, rgba(200,16,46,.07), transparent 34%),
        var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 34px;
      border-radius: 50%;
    }

    .logo {
      width: 132px;
      height: 132px;
      object-fit: contain;
      display: block;
    }

    .code {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 auto 16px;
      max-width: 520px;
      font-size: clamp(2rem, 8vw, 3.45rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 850;
    }

    .intro {
      margin: 0 auto 30px;
      max-width: 475px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .btn {
      width: min(100%, 340px);
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 14px 24px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    .btn:focus-visible, .logo-link:focus-visible {
      outline: 3px solid rgba(200,16,46,.30);
      outline-offset: 4px;
    }

    .btn-primary {
      border: 2px solid var(--red);
      background: var(--red);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      border: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: var(--ink);
      color: var(--white);
      transform: translateY(-1px);
    }

    .rule {
      width: 48px;
      height: 4px;
      margin: 36px auto 18px;
      border-radius: 99px;
      background: var(--red);
    }

    .tagline {
      margin: 0;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink);
    }

    @media (max-width: 420px) {
      body { padding: 24px 18px; }
      .logo { width: 112px; height: 112px; }
      .logo-link { margin-bottom: 28px; }
      .intro { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <a class="logo-link" href="https://eatmeatmove.com" aria-label="Go to Eat Meat Move home">
      <img class="logo" src="emm-logo.png" alt="Eat Meat Move, Stronger for Life">
    </a>

    <p class="code">404 | Page not found</p>
    <h1 id="page-title">Looks like this page took a wrong turn.</h1>
    <p class="intro">Head back to where you were, or return home and keep moving forward.</p>

    <div class="actions">
      <button class="btn btn-primary" type="button" id="go-back">Go back</button>
      <a class="btn btn-secondary" href="https://eatmeatmove.com">Go to Eat Meat Move</a>
    </div>

    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Stronger for Life.</p>
  </main>

  <script>
    document.getElementById('go-back').addEventListener('click', function () {
      const home = 'https://eatmeatmove.com';
      if (document.referrer || window.history.length > 1) {
        window.history.back();
        window.setTimeout(function () {
          if (document.visibilityState === 'visible') window.location.href = home;
        }, 900);
      } else {
        window.location.href = home;
      }
    });
  </script>
</body>
</html>
